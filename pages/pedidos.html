<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos | Sushi Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
    <header class="bg-[#1A1A1A] text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="../index.html" class="flex items-center gap-2">
                <i class="fa-solid fa-fish text-[#D92525] text-2xl"></i>
                <h1 class="text-xl font-bold">SUSHI<span class="text-[#D92525]">EXPRESS</span></h1>
            </a>
            <button onclick="sair()" class="text-sm text-gray-300 hover:text-white"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-10 max-w-4xl">
        <h2 class="text-3xl font-bold mb-6">Meus Pedidos</h2>
        <div id="lista-pedidos" class="space-y-4">
            <!-- Renderizado via JS -->
            <div class="text-center text-gray-500 py-10"><i class="fa-solid fa-spinner fa-spin text-2xl"></i> Carregando...</div>
        </div>
    </main>

    <script>
        // Função para formatar moeda
        const formatarMoeda = (valor) => Number(valor).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

        async function carregarPedidos() {
            const usuarioStr = localStorage.getItem('usuario');
            if (!usuarioStr) return window.location.href = 'pages/login.html';
            
            const usuario = JSON.parse(usuarioStr);
            const container = document.getElementById('lista-pedidos');

            try {
                const response = await fetch(`http://localhost:3000/api/usuarios/${usuario.id}/pedidos`);
                const pedidos = await response.json();

                if (pedidos.length === 0) {
                    container.innerHTML = '<p class="text-gray-500">Você ainda não fez nenhum pedido.</p>';
                    return;
                }

                container.innerHTML = pedidos.map(p => `
                    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 flex justify-between items-center">
                        <div>
                            <span class="text-xs text-gray-400 font-bold uppercase">Pedido #${p.id}</span>
                            <p class="text-sm text-gray-600 mt-1"><i class="fa-regular fa-calendar"></i> ${new Date(p.criado_em).toLocaleDateString('pt-BR')} às ${new Date(p.criado_em).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}</p>
                            <span class="inline-block mt-2 px-3 py-1 bg-yellow-100 text-yellow-800 text-xs rounded-full font-semibold">${p.status}</span>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-gray-500 mb-1">Total Pago</p>
                            <p class="text-xl font-bold text-[#D92525]">${formatarMoeda(p.total)}</p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<p class="text-red-500">Erro ao carregar pedidos.</p>';
            }
        }

        function sair() {
            localStorage.removeItem('usuario');
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', carregarPedidos);
    </script>
</body>
</html>
